---
- name: Reload AppArmor
  ansible.builtin.command: >-
    apparmor_parser -r /etc/apparmor.d/usr.local.bin.rootlesskit
  changed_when: true
  when:
    - forgejo_apparmor_profile is defined
    - forgejo_apparmor_profile is changed

- name: Restart Forgejo
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_dir }}"
    state: restarted
  when: ansible_connection != 'docker' and (ansible_facts['virtualization_type'] | default('')) != 'docker'
