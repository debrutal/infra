---
- name: Verify Cloudflare API token is present and decrypted
  ansible.builtin.assert:
    that:
      - vault_cf_dns_api_token is defined
      - vault_cf_dns_api_token != ''
      - "'ANSIBLE_VAULT' not in (vault_cf_dns_api_token | string)"
    fail_msg: "Cloudflare DNS API Token in inventory/group_vars/vault.yml could not be decrypted! Please pass '--ask-vault-pass' (or '-J') to ansible-playbook."
  when: traefik_acme_enabled and traefik_acme_challenge_type == 'dns' and ansible_connection != 'docker'

- name: Ensure Traefik Docker network exists
  community.docker.docker_network:
    name: "{{ traefik_network_name }}"
    state: present
  when: ansible_connection != 'docker' and (ansible_facts['virtualization_type'] | default('')) != 'docker'

- name: Create Traefik configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ traefik_dir }}"
    - "{{ traefik_dir }}/dynamic"
    - "{{ traefik_dir }}/acme"
    - "{{ traefik_dir }}/certs"
    - "{{ traefik_dir }}/scripts"

- name: Create ACME storage file with secure permissions
  ansible.builtin.file:
    path: "{{ traefik_dir }}/acme/acme.json"
    state: touch
    mode: '0600'
    modification_time: preserve
    access_time: preserve

- name: Deploy kita-kit.de Lego certificate renewal script
  ansible.builtin.template:
    src: cert-kitakit.sh.j2
    dest: "{{ traefik_dir }}/scripts/cert-kitakit.sh"
    mode: '0750'
  when: traefik_acme_kitakit_token is defined and traefik_acme_kitakit_token != ''

- name: Deploy kita-kit.de certificate renewal systemd service and timer
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: "traefik-cert-kitakit.service.j2", dest: "traefik-cert-kitakit.service" }
    - { src: "traefik-cert-kitakit.timer.j2", dest: "traefik-cert-kitakit.timer" }
  when: ansible_connection != 'docker' and (ansible_facts['virtualization_type'] | default('')) != 'docker' and traefik_acme_kitakit_token is defined and traefik_acme_kitakit_token != ''

- name: Enable and start kita-kit.de certificate renewal timer
  ansible.builtin.systemd:
    name: traefik-cert-kitakit.timer
    enabled: true
    state: started
    daemon_reload: true
  when: ansible_connection != 'docker' and (ansible_facts['virtualization_type'] | default('')) != 'docker' and traefik_acme_kitakit_token is defined and traefik_acme_kitakit_token != ''

- name: Obtain initial kita-kit.de wildcard certificate if not present
  ansible.builtin.command: "{{ traefik_dir }}/scripts/cert-kitakit.sh"
  args:
    creates: "{{ traefik_dir }}/certs/certificates/staging.kita-kit.de.crt"
  when: ansible_connection != 'docker' and (ansible_facts['virtualization_type'] | default('')) != 'docker' and traefik_acme_kitakit_token is defined and traefik_acme_kitakit_token != ''

- name: Deploy Traefik static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_dir }}/traefik.yml"
    mode: '0644'
  notify: Restart Traefik

- name: Deploy Traefik dynamic configuration
  ansible.builtin.template:
    src: dynamic_conf.yml.j2
    dest: "{{ traefik_dir }}/dynamic/dynamic_conf.yml"
    mode: '0644'
  notify: Restart Traefik

- name: Deploy Traefik docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ traefik_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart Traefik

- name: Reset ACME certificate storage if requested
  ansible.builtin.copy:
    content: "{}\n"
    dest: "{{ traefik_dir }}/acme/acme.json"
    mode: '0600'
  when: (traefik_reset_acme | default(false)) | bool
  notify: Restart Traefik

- name: Start Traefik container via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_dir }}"
    state: present
    recreate: "{{ (traefik_force_restart | default(false)) | ternary('always', 'auto') }}"
  when: ansible_connection != 'docker' and (ansible_facts['virtualization_type'] | default('')) != 'docker'
