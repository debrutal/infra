---
- name: Create LGTM configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ lgtm_dir }}"
    - "{{ lgtm_dir }}/grafana"
    - "{{ lgtm_dir }}/grafana/provisioning"
    - "{{ lgtm_dir }}/grafana/provisioning/datasources"
    - "{{ lgtm_dir }}/grafana/provisioning/dashboards"
    - "{{ lgtm_dir }}/grafana/provisioning/dashboards/json"

- name: Deploy Loki configuration file
  ansible.builtin.template:
    src: loki-config.yaml.j2
    dest: "{{ lgtm_dir }}/loki-config.yaml"
    mode: '0644'

- name: Deploy Promtail configuration file
  ansible.builtin.template:
    src: promtail-config.yaml.j2
    dest: "{{ lgtm_dir }}/promtail-config.yaml"
    mode: '0644'

- name: Deploy Prometheus configuration file
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ lgtm_dir }}/prometheus.yml"
    mode: '0644'

- name: Deploy Tempo configuration file
  ansible.builtin.template:
    src: tempo-config.yaml.j2
    dest: "{{ lgtm_dir }}/tempo-config.yaml"
    mode: '0644'

- name: Deploy OpenTelemetry Collector configuration file
  ansible.builtin.template:
    src: otel-collector-config.yaml.j2
    dest: "{{ lgtm_dir }}/otel-collector-config.yaml"
    mode: '0644'

- name: Deploy Grafana datasources configuration file
  ansible.builtin.template:
    src: grafana-datasources.yaml.j2
    dest: "{{ lgtm_dir }}/grafana/provisioning/datasources/datasources.yaml"
    mode: '0644'

- name: Deploy Grafana dashboards provider configuration file
  ansible.builtin.template:
    src: grafana-dashboards.yaml.j2
    dest: "{{ lgtm_dir }}/grafana/provisioning/dashboards/dashboards.yaml"
    mode: '0644'

- name: Deploy Mini Server Overview dashboard
  ansible.builtin.template:
    src: mini-overview-dashboard.json.j2
    dest: "{{ lgtm_dir }}/grafana/provisioning/dashboards/json/mini-overview.json"
    mode: '0644'

- name: Deploy LGTM docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ lgtm_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start LGTM stack containers via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ lgtm_dir }}"
    state: present
  when: ansible_connection != 'docker' and ansible_virtualization_type != 'docker'
